name: Publish release

on:
  push:
    branches: [main]
    paths: [.github/release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release tooling
        run: python3 -m unittest discover -s scripts -p 'release_test.py'
      - name: Publish verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
